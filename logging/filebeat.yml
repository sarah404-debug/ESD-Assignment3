# Filebeat reads the JSON log files Docker keeps for each container,
# turns each JSON line into searchable fields, and sends them to Elasticsearch.

filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*.log

processors:
  # Add the container name/id so we know which container each line came from.
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  # Only keep logs from the quest-app replicas (HTTP and gRPC) and Envoy (its
  # access log) of this project ("esd-a3"). Docker Compose labels every
  # container with its project and service name (the dots in label names
  # become underscores here).
  - drop_event:
      when:
        not:
          and:
            - equals:
                container.labels.com_docker_compose_project: "esd-a3"
            - or:
                - equals:
                    container.labels.com_docker_compose_service: "quest-app"
                - equals:
                    container.labels.com_docker_compose_service: "envoy"

  # The app writes one JSON object per line. Parse it into fields under "app.*".
  # (Under a prefix so our field names, like "service" and "event", don't clash
  # with the standard fields Elasticsearch already defines.)
  - decode_json_fields:
      when:
        regexp:
          message: '^\{'
      fields: ["message"]
      target: "app"
      add_error_key: true

  # Drop plain-text lines (Uvicorn's and Envoy's own startup/info lines) - they aren't JSON.
  - drop_event:
      when:
        not:
          has_fields: ["app.service"]

  # Use the time the app (or Envoy) wrote in the log as the event's @timestamp.
  - timestamp:
      field: app.time
      layouts:
        - "2006-01-02T15:04:05.999999Z07:00"   # replicas
        - "2006-01-02T15:04:05.999Z"           # Envoy (START_TIME, UTC)
      ignore_failure: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # One fixed data stream (not one per day), so a single retention setting covers all logs.
  index: "quest-app-logs-main"

setup.ilm.enabled: false
setup.template.name: "quest-app-logs"
setup.template.pattern: "quest-app-logs-*"