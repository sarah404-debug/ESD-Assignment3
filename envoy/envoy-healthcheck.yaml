# PART D, EXPERIMENT 3: FAILURE AND RECOVERY (active health checks)
# A copy of envoy.yaml (equal round robin, no delay); the ONLY difference is
# active health checks on both clusters. Settings (same for HTTP and gRPC):
#   interval 2 s, timeout 1 s, unhealthy after 2 failed checks in a row,
#   healthy again after 2 passed checks in a row.
# HTTP: GET / must answer 200. gRPC: grpc.health.v1.Health/Check for
# quest.v1.QuestService must answer SERVING.
# Expected removal time of a stopped replica: about 2-4 s (2 failures 2 s apart,
# plus up to 1 s timeout); expected recovery: about 2-4 s after it answers again.
# Use:     set ENVOY_CONFIG=envoy-healthcheck.yaml   then   docker compose up -d envoy
# Restore: set ENVOY_CONFIG=                         then   docker compose up -d envoy
#
# Envoy: the one front door for all clients.
# It listens on 8000 (HTTP) and 50051 (gRPC) and forwards each request to a
# replica of quest-app.
#
# Part A sent everything to replica A only. Part C (now): A, B and C are all
# destinations, with equal-weight round robin (A, B, C, A, B, C, ...), for both
# HTTP and gRPC.

admin:
  # Envoy's own admin page: http://localhost:9901 (stats, destinations and
  # whether each one is healthy). Prometheus will read Envoy's metrics here later.
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  # ── Listeners: the doors clients connect to ─────────────────────
  listeners:
    # HTTP clients (browser, curl, scripts) connect here.
    - name: http_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: http_ingress
                # Request correlation: keep the caller's X-Request-ID (or make one
                # if it sent none) and pass it on, so Envoy and the replica
                # tag the request with the same ID.
                generate_request_id: true
                preserve_external_request_id: true
                # Access log: one JSON line per request on stdout (Docker keeps it,
                # Filebeat ships it to Elasticsearch). The field names match the
                # replicas' logs, so one search on request_id finds both lines.
                # replica comes from the X-Replica header the replica answers with;
                # upstream_host is the replica's address Envoy picked.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          service: "envoy"
                          event: "envoy_access"
                          listener: "http"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          replica: "%RESP(X-REPLICA)%"
                route_config:
                  virtual_hosts:
                    - name: quest_http
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: quest_http }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # gRPC clients connect here. gRPC runs on HTTP/2, and Envoy reads it as
    # HTTP/2 (not as plain TCP), so it sees every call on its own. That matters
    # in Part C, when calls are spread across replicas one by one.
    - name: grpc_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 50051 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_ingress
                codec_type: HTTP2
                # Same request-ID handling as HTTP (gRPC metadata x-request-id
                # is an HTTP/2 header).
                generate_request_id: true
                preserve_external_request_id: true
                # Access log: same format as the HTTP listener, plus the gRPC
                # status code. The x-replica metadata is an HTTP/2 response header.
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          time: "%START_TIME%"
                          service: "envoy"
                          event: "envoy_access"
                          listener: "grpc"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          grpc_code: "%GRPC_STATUS%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          replica: "%RESP(X-REPLICA)%"
                route_config:
                  virtual_hosts:
                    - name: quest_grpc
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: quest_grpc
                            # Use the deadline the gRPC client sends (grpc-timeout)
                            # instead of Envoy's own 15 s default.
                            timeout: 0s
                            max_stream_duration:
                              grpc_timeout_header_max: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ── Clusters: where Envoy may send requests ─────────────────────
  clusters:
    # HTTP destinations: replicas A, B and C, equal weight (each counts 1).
    - name: quest_http
      type: STRICT_DNS            # look each replica's name up in Docker's DNS
      lb_policy: ROUND_ROBIN      # take turns: A, B, C, A, B, C, ...
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s   # check every 2 s even before traffic arrives (default 60 s)
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check:
            path: "/"
      load_assignment:
        cluster_name: quest_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-1, port_value: 8000 }   # replica A
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-2, port_value: 8000 }   # replica B
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-3, port_value: 8000 }   # replica C

    # gRPC destinations: replicas A, B and C, equal weight. Envoy talks HTTP/2
    # to the replicas too, because gRPC needs it. Because the gRPC listener is
    # HTTP/2 (not plain TCP), Envoy picks a replica for every call, even though
    # the client sends all its calls over one connection.
    - name: quest_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 2
          grpc_health_check:
            service_name: "quest.v1.QuestService"
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: quest_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-1, port_value: 50051 }   # replica A
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-2, port_value: 50051 }   # replica B
              - endpoint:
                  address:
                    socket_address: { address: esd-a3-quest-app-3, port_value: 50051 }   # replica C
