# Project name: keeps these containers separate from the earlier assignments
# (Docker Desktop shows them grouped under "esd-a3").
name: esd-a3

services:
  # Envoy: the front door. Clients use localhost:8000 (HTTP) and
  # localhost:50051 (gRPC); Envoy forwards each request to a quest-app replica.
  # Which setup file it uses: envoy/envoy.yaml (normal: equal round robin)
  # unless ENVOY_CONFIG names another file in envoy/ for a Part D experiment,
  # e.g. ENVOY_CONFIG=envoy-weighted.yaml. Clearing ENVOY_CONFIG and running
  # `docker compose up -d envoy` again restores the normal setup.
  envoy:
    image: envoyproxy/envoy:v1.31.2
    command: ["-c", "/etc/envoy/${ENVOY_CONFIG:-envoy.yaml}"]
    ports:
      - "8000:8000"     # HTTP
      - "50051:50051"   # gRPC
      - "9901:9901"     # Envoy's admin page (stats and destinations)
    volumes:
      - ./envoy:/etc/envoy:ro
    depends_on:
      - quest-app

  # Each container answers both HTTP (8000) and gRPC (50051).
  # Docker Compose scaling runs three copies: esd-a3-quest-app-1, -2 and -3,
  # which name themselves replica A, B and C (quest_core/replica.py).
  # No "ports:" here: three copies can't all use port 8000 on the laptop. The
  # copies are only reachable inside Docker's network (Envoy will be the way in).
  quest-app:
    build: .
    deploy:
      replicas: 3
    environment:
      - GRPC_PORT=50051
      # How a copy finds its own number (and so its letter) in Docker's DNS.
      - REPLICA_DNS_PREFIX=esd-a3-quest-app-
      # Part D experiment 2: make one replica slow, e.g. SLOW_REPLICA=B and
      # SLOW_DELAY_MS=1000 (off when SLOW_REPLICA is empty).
      - SLOW_REPLICA=${SLOW_REPLICA:-}
      - SLOW_DELAY_MS=${SLOW_DELAY_MS:-0}
      - FAULT_DELAY_MS=${FAULT_DELAY_MS:-0}
      - FAULT_EVERY_N=${FAULT_EVERY_N:-0}
      # Rate limit for POST /quests: this many calls per client IP per window.
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-30}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-10}
      # The shared quest database (quest_core/store.py), kept on the questdata volume.
      - QUEST_DB_PATH=/data/quests.db
    volumes:
      - questdata:/data
    # Docker keeps the app's stdout (our JSON logs) in a json-file on disk.
    # These options cap it at 3 files of 10 MB each, so old container logs get rotated out.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Provisioning: the Prometheus data source and the dashboards are loaded
      # from these folders every time Grafana starts.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # local demo only, no login needed
      - ES_JAVA_OPTS=-Xms512m -Xmx512m    # keep memory use small
    ports:
      - "9200:9200"
    volumes:
      # Named volume: the stored logs survive container restarts.
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./logging/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Where Docker stores each container's log files:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Lets Filebeat look up container names:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch

volumes:
  esdata:
  # Named volume for the quest database: quests survive container restarts.
  questdata: