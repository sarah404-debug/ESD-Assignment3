<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1400" height="880" fill="#ffffff"/>

  <text x="700" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Assignment 3 architecture: Envoy in front of three replicas</text>
  <text x="700" y="74" text-anchor="middle" font-size="16" fill="#4b5563">Part A: Envoy sends every HTTP request and gRPC call to replica A; B and C run but get no traffic</text>

  <!-- Clients -->
  <rect x="40" y="150" width="220" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="182" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">HTTP clients</text>
  <text x="150" y="206" text-anchor="middle" font-size="14" fill="#374151">browser, curl, test client</text>
  <text x="150" y="226" text-anchor="middle" font-size="14" fill="#374151">localhost:8000</text>

  <rect x="40" y="330" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">gRPC clients</text>
  <text x="150" y="386" text-anchor="middle" font-size="14" fill="#374151">grpc_client.py, test client</text>
  <text x="150" y="406" text-anchor="middle" font-size="14" fill="#374151">localhost:50051</text>

  <!-- Envoy -->
  <rect x="320" y="110" width="360" height="430" rx="12" fill="#fafafa" stroke="#374151" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="340" y="136" font-size="15" font-weight="700" fill="#111827">container envoy (Envoy v1.31)</text>

  <rect x="345" y="150" width="310" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="500" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">HTTP listener :8000</text>
  <text x="500" y="198" text-anchor="middle" font-size="13" fill="#374151">keeps or creates x-request-id</text>
  <text x="500" y="218" text-anchor="middle" font-size="13" fill="#374151">all paths → cluster quest_http</text>

  <rect x="345" y="330" width="310" height="86" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="500" y="356" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">gRPC listener :50051 (HTTP/2)</text>
  <text x="500" y="378" text-anchor="middle" font-size="13" fill="#374151">sees and routes each call separately</text>
  <text x="500" y="398" text-anchor="middle" font-size="13" fill="#374151">all calls → cluster quest_grpc</text>

  <text x="500" y="270" text-anchor="middle" font-size="13" fill="#374151">clusters quest_http and quest_grpc:</text>
  <text x="500" y="290" text-anchor="middle" font-size="13" fill="#374151">round robin, Part A destination = replica A only</text>
  <text x="500" y="470" text-anchor="middle" font-size="13" fill="#374151">admin :9901 (stats, destination health)</text>
  <text x="500" y="490" text-anchor="middle" font-size="13" fill="#374151">the only container with ports on the laptop</text>
  <text x="500" y="510" text-anchor="middle" font-size="13" fill="#374151">(8000, 50051, 9901)</text>

  <!-- Replicas -->
  <rect x="760" y="110" width="330" height="125" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
  <text x="925" y="138" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Replica A (esd-a3-quest-app-1)</text>
  <text x="925" y="162" text-anchor="middle" font-size="13" fill="#374151">one process: HTTP :8000 + gRPC :50051</text>
  <text x="925" y="182" text-anchor="middle" font-size="13" fill="#374151">shared rules: quest_core/rules.py</text>
  <text x="925" y="202" text-anchor="middle" font-size="13" fill="#b45309">in memory: rate-limit counters</text>
  <text x="925" y="222" text-anchor="middle" font-size="13" fill="#374151">logs and metrics tagged replica="A"</text>

  <rect x="760" y="262" width="330" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="925" y="290" text-anchor="middle" font-size="17" font-weight="700" fill="#4b5563">Replica B (esd-a3-quest-app-2)</text>
  <text x="925" y="314" text-anchor="middle" font-size="13" fill="#6b7280">running, same code, HTTP + gRPC</text>
  <text x="925" y="334" text-anchor="middle" font-size="13" fill="#b45309">in memory: its own rate-limit counters</text>
  <text x="925" y="354" text-anchor="middle" font-size="13" fill="#6b7280">no traffic in Part A</text>

  <rect x="760" y="400" width="330" height="110" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="925" y="428" text-anchor="middle" font-size="17" font-weight="700" fill="#4b5563">Replica C (esd-a3-quest-app-3)</text>
  <text x="925" y="452" text-anchor="middle" font-size="13" fill="#6b7280">running, same code, HTTP + gRPC</text>
  <text x="925" y="472" text-anchor="middle" font-size="13" fill="#b45309">in memory: its own rate-limit counters</text>
  <text x="925" y="492" text-anchor="middle" font-size="13" fill="#6b7280">no traffic in Part A</text>

  <!-- Shared database -->
  <rect x="1150" y="200" width="215" height="220" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1257" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">Shared database</text>
  <text x="1257" y="256" text-anchor="middle" font-size="13" fill="#374151">SQLite /data/quests.db</text>
  <text x="1257" y="276" text-anchor="middle" font-size="13" fill="#374151">on Docker volume questdata</text>
  <text x="1257" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">tables:</text>
  <text x="1257" y="326" text-anchor="middle" font-size="13" fill="#374151">quests (quest data)</text>
  <text x="1257" y="346" text-anchor="middle" font-size="13" fill="#374151">idempotency_keys</text>
  <text x="1257" y="376" text-anchor="middle" font-size="12" fill="#6b7280">writes are locked/conditional,</text>
  <text x="1257" y="394" text-anchor="middle" font-size="12" fill="#6b7280">so no duplicates across replicas</text>

  <!-- Client → Envoy -->
  <line x1="260" y1="195" x2="343" y2="193" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="260" y1="375" x2="343" y2="373" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>

  <!-- Envoy → replicas -->
  <line x1="655" y1="188" x2="758" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/>
  <text x="700" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">HTTP</text>
  <path d="M655,370 C710,370 715,215 758,205" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/>
  <text x="732" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">gRPC</text>
  <line x1="680" y1="330" x2="758" y2="320" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#grey)"/>
  <line x1="680" y1="455" x2="758" y2="455" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#grey)"/>
  <text x="725" y="562" text-anchor="middle" font-size="12" fill="#6b7280">grey dashed: not an Envoy</text>
  <text x="725" y="578" text-anchor="middle" font-size="12" fill="#6b7280">destination yet (Part C)</text>

  <!-- Replicas → DB -->
  <line x1="1090" y1="172" x2="1148" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <line x1="1090" y1="317" x2="1148" y2="312" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
  <line x1="1090" y1="455" x2="1148" y2="380" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>

  <!-- Observability -->
  <rect x="40" y="600" width="640" height="104" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="60" y="628" font-size="16" font-weight="700" fill="#92400e">Logs</text>
  <text x="60" y="652" font-size="13" fill="#374151">Each container writes JSON lines to stdout with service, replica and request_id.</text>
  <text x="60" y="672" font-size="13" fill="#374151">Docker → Filebeat → Elasticsearch → Kibana. Envoy and the replica share one request ID,</text>
  <text x="60" y="692" font-size="13" fill="#374151">so one search finds both (Envoy access logs are added in Part B).</text>

  <rect x="720" y="600" width="645" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="740" y="628" font-size="16" font-weight="700" fill="#991b1b">Metrics</text>
  <text x="740" y="652" font-size="13" fill="#374151">Prometheus scrapes /metrics on replicas A, B and C (port 8000) and Envoy (port 9901)</text>
  <text x="740" y="672" font-size="13" fill="#374151">directly, not through Envoy's balanced route. Grafana shows HTTP and gRPC per replica</text>
  <text x="740" y="692" font-size="13" fill="#374151">(Part B). Labels are small fixed sets: replica, method, status. No IDs.</text>

  <!-- Legend: shared vs per replica -->
  <rect x="40" y="730" width="1325" height="120" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="60" y="760" font-size="16" font-weight="700" fill="#111827">State: shared or kept in each replica?</text>
  <rect x="60" y="776" width="18" height="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="88" y="790" font-size="14" fill="#374151"><tspan font-weight="700">Shared by all replicas:</tspan> quest data and idempotency records (SQLite database on the questdata volume).</text>
  <rect x="60" y="808" width="18" height="18" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="88" y="822" font-size="14" fill="#374151"><tspan font-weight="700">Kept in each replica:</tspan> rate-limit counters (in memory). Each replica counts on its own, so spreading requests weakens the limit.</text>
</svg>
